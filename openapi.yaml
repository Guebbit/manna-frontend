openapi: "3.1.0"
info:
  title: Manna — Personal AI Agent Platform API
  description: |
    Local-first agentic loop wrapping Ollama-hosted LLMs.
    Exposes a generic agent endpoint (`/run`), IDE-specific direct endpoints,
    file upload endpoints (image/audio/PDF), sketch-processing endpoints,
    and an OpenAI-compatible adapter layer for Open WebUI integration.

    **Base URL**: `http://localhost:3001`
  version: "1.1.0"
  contact:
    name: Guebbit
    url: https://github.com/Guebbit/AI-coding-assistant

servers:
  - url: http://localhost:3001
    description: Local development server (default)

tags:
  - name: Agent
    description: Core agentic loop — multi-step reasoning with tools
  - name: IDE
    description: Direct single-LLM-call endpoints for IDE integration
  - name: Upload
    description: Multipart file upload endpoints — process images, audio, PDFs directly
  - name: Sketch
    description: Sketch processing endpoints (inking, colorization) — PR #19 pending merge
  - name: OpenAI Compat
    description: "OpenAI-compatible adapter for Open WebUI (⚠ temporary — will be removed when custom frontend ships)"
  - name: System
    description: Health and operational endpoints

paths:
  # ─────────────────────────────────────────────────────────────────────
  # SYSTEM
  # ─────────────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: healthCheck
      summary: Liveness check
      description: Returns 200 OK with a timestamp. No LLM call. Safe to poll.
      tags: [System]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ─────────────────────────────────────────────────────────────────────
  # AGENT
  # ─────────────────────────────────────────────────────────────────────
  /run:
    post:
      operationId: runAgentTask
      summary: Submit a task to the agentic loop
      description: |
        Triggers the full agent reasoning loop:
        1. Query memory for relevant past entries
        2. Build prompt (task + context + memory + tool descriptions)
        3. Route to model profile (fast / reasoning / code / default)
        4. LLM returns structured JSON: `{ thought, action, input }`
        5. If `action !== "none"`, execute tool, append result, repeat
        6. Stop when `action === "none"` or MAX_STEPS reached (default 5)

        Available tools in the loop: read_file, shell, mysql_query, browser_fetch,
        image_classify, semantic_search, speech_to_text, read_pdf,
        code_autocomplete, generate_diagram.
        Write-gated tools (require allowWrite): write_file, scaffold_project.
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Agent completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          description: Invalid request (missing task, invalid profile)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unhandled error inside the agent loop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────��───────────────────────────────────
  # IDE ENDPOINTS
  # ─────────────────────────────────────────────────────────────────────
  /autocomplete:
    post:
      operationId: autocomplete
      summary: IDE cursor-time code completion
      description: |
        Single LLM call via TOOL_IDE_MODEL. Results cached in-memory (LRU)
        for 30s. Rate limit: 120 req/min per IP. Timeout: 2500ms.
      tags: [IDE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutocompleteRequest"
      responses:
        "200":
          description: Completion generated (or served from cache)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocompleteResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
        "500":
          description: LLM call failed or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lint-conventions:
    post:
      operationId: lintConventions
      summary: Two-pass code quality analysis
      description: |
        Pass 1 (deterministic): TypeScript compiler diagnostics + convention rules.
        Pass 2 (optional LLM): AI enrichment via AGENT_MODEL_CODE.
        Rate limit: 30 req/min. Timeout: 10000ms.
      tags: [IDE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LintConventionsRequest"
      responses:
        "200":
          description: Analysis complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintConventionsResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
        "500":
          description: LLM call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /page-review:
    post:
      operationId: pageReview
      summary: Whole-file engineering review
      description: |
        Single LLM call returning categorized suggestions (correctness,
        maintainability, standards, enhancements). Rate limit: 20 req/min.
        Timeout: 20000ms.
      tags: [IDE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageReviewRequest"
      responses:
        "200":
          description: Review complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageReviewResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
        "500":
          description: LLM call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────
  # UPLOAD ENDPOINTS (merged via PR #29)
  # ─────────────────────────────────────────────────────────────────────
  /upload/image-classify:
    post:
      operationId: uploadImageClassify
      summary: Classify/describe an uploaded image
      description: |
        Accepts a multipart image upload and sends it to a vision model
        (TOOL_VISION_MODEL, default llava-llama3) for classification/description.
        Internally calls the same image_classify tool with inline base64 data.
        Max file size: 50 MB.
      tags: [Upload]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadImageClassifyRequest"
      responses:
        "200":
          description: Image classified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageClassifyResponse"
        "400":
          description: No file uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Vision model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /upload/speech-to-text:
    post:
      operationId: uploadSpeechToText
      summary: Transcribe an uploaded audio file
      description: |
        Accepts a multipart audio upload and sends it to an STT model
        (TOOL_STT_MODEL, default whisper) via Ollama's OpenAI-compatible
        /v1/audio/transcriptions endpoint.
        Max file size: 50 MB.
      tags: [Upload]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadSpeechToTextRequest"
      responses:
        "200":
          description: Audio transcribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechToTextResponse"
        "400":
          description: No file uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: STT model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /upload/read-pdf:
    post:
      operationId: uploadReadPdf
      summary: Extract text from an uploaded PDF
      description: |
        Accepts a multipart PDF upload and extracts text via pdf-parse.
        No LLM call. Max file size: 50 MB.
      tags: [Upload]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadReadPdfRequest"
      responses:
        "200":
          description: PDF text extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadPdfResponse"
        "400":
          description: No file uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: PDF parsing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────
  # SKETCH ENDPOINTS (from PR #19 — pending merge)
  # ─────────────────────────────────────────────────────────────────────
  /ink:
    post:
      operationId: inkSketch
      summary: Describe inking for a sketch image
      description: |
        Accepts a sketch image upload and returns a detailed inking description
        (line weights, contours, hatching style). Uses TOOL_VISION_MODEL.
        Timeout: 60000ms. Max file size: 10 MB.
        **Status: PR #19 pending merge.**
      tags: [Sketch]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InkRequest"
      responses:
        "200":
          description: Inking description generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InkResponse"
        "400":
          description: No image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Vision model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ink-and-color:
    post:
      operationId: inkAndColorSketch
      summary: Auto-classify then ink and/or colorize a sketch
      description: |
        Classifies image as sketch/inked/unknown, then returns inking +
        colorization guidance for sketches, or colorization-only for inked
        drawings. Pass `sketchState` to skip classification.
        Timeout: 60000ms. Max file size: 10 MB.
        **Status: PR #19 pending merge.**
      tags: [Sketch]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InkAndColorRequest"
      responses:
        "200":
          description: Colorization description generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InkAndColorResponse"
        "400":
          description: No image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Vision model call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────
  # OPENAI COMPAT (merged via PR #28)
  # ─────────────────────────────────────────────────────────────────────
  /v1/models:
    get:
      operationId: listOpenAiModels
      summary: List available Manna models (OpenAI format)
      description: |
        Returns Manna profiles as OpenAI-style model objects. Used by
        Open WebUI to populate the model picker.
        Rate limit: 120 req/min per IP.
        ⚠ TEMPORARY — will be removed when the custom frontend ships.
      tags: [OpenAI Compat]
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiModelListResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"

  /v1/chat/completions:
    post:
      operationId: openAiChatCompletion
      summary: OpenAI-compatible chat completion via Manna agent
      description: |
        Translates OpenAI ChatCompletion format → agent.run() → ChatCompletion
        response. Supports streaming (buffered SSE).

        Model mapping:
        - `manna` / `manna-agent` → auto (router decides)
        - `manna-fast` → fast profile
        - `manna-reasoning` → reasoning profile
        - `manna-code` → code profile

        Write mode: prefix message with `[WRITE]` or set `allowWrite: true`.
        Rate limit: 60 req/min (configurable via OPENAI_COMPAT_RATE_LIMIT).
        ⚠ TEMPORARY — will be removed when the custom frontend ships.
      tags: [OpenAI Compat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAiChatCompletionRequest"
      responses:
        "200":
          description: Chat completion (non-streaming)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE stream of ChatCompletionChunk objects, ending with `data: [DONE]`
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitResponse"
        "500":
          description: Agent loop failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ═══════════════════════════════════════════════════════════════════════
# SCHEMAS
# ═══════════════════════════════════════════════════════════════════════
components:
  schemas:
    # ── Shared ──────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        requestId:
          type: string
          format: uuid

    ValidationErrorResponse:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
        details:
          type: object
          description: Zod flattened error object

    RateLimitResponse:
      type: object
      required: [error, retryAfterSeconds]
      properties:
        error:
          type: string
          example: Rate limit exceeded
        retryAfterSeconds:
          type: integer
          minimum: 1

    ModelProfile:
      type: string
      enum: [fast, reasoning, code, default]
      description: Forces a specific Ollama model profile, bypassing automatic routing

    # ── System ──────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    # ── Agent /run ──────────────────────────────────────────────────────
    RunRequest:
      type: object
      required: [task]
      properties:
        task:
          type: string
          minLength: 1
          description: Natural-language description of what the agent should do
        allowWrite:
          type: boolean
          default: false
          description: When true, enables write_file and scaffold_project tools
        profile:
          $ref: "#/components/schemas/ModelProfile"

    RunResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string
          description: The agent's final answer

    # ── IDE /autocomplete ───────────────────────────────────────────────
    AutocompleteRequest:
      type: object
      required: [prefix]
      properties:
        prefix:
          type: string
          minLength: 1
          description: Code appearing before the cursor
        suffix:
          type: string
          description: Code appearing after the cursor (fill-in-the-middle)
        language:
          type: string
          description: Language hint (e.g. "typescript", "python")
          default: plaintext

    AutocompleteResponse:
      type: object
      required: [completion, model, language, cached, latencyMs, createdAtIso]
      properties:
        completion:
          type: string
        model:
          type: string
        language:
          type: string
        cached:
          type: boolean
        latencyMs:
          type: integer
        createdAtIso:
          type: string
          format: date-time

    # ── IDE /lint-conventions ───────────────────────────────────────────
    LintConventionsRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Source code to analyze
        language:
          type: string
          description: Language hint. Falls back to filePath extension.
        filePath:
          type: string
          description: Virtual file path for extension inference and TS context
        includeLlm:
          type: boolean
          default: true
          description: Whether to run the LLM enrichment pass
        model:
          type: string
          description: Override the LLM model (defaults to AGENT_MODEL_CODE)
        maxFindings:
          type: integer
          minimum: 1
          maximum: 200
          default: 80
          description: Maximum total findings to return

    Finding:
      type: object
      required: [source, severity, category, message]
      properties:
        source:
          type: string
          enum: [typescript, convention, llm]
        severity:
          type: string
          enum: [error, warning, info]
        category:
          type: string
        message:
          type: string
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        rule:
          type: string

    LintConventionsSummary:
      type: object
      required: [total, errors, warnings, infos, deterministicCount, llmCount]
      properties:
        total:
          type: integer
        errors:
          type: integer
        warnings:
          type: integer
        infos:
          type: integer
        deterministicCount:
          type: integer
        llmCount:
          type: integer

    LintConventionsResponse:
      type: object
      required: [requestId, language, filePath, summary, findings, llmModelUsed, latencyMs]
      properties:
        requestId:
          type: string
          format: uuid
        language:
          type: string
        filePath:
          type: string
        summary:
          $ref: "#/components/schemas/LintConventionsSummary"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        llmModelUsed:
          type: string
          nullable: true
        latencyMs:
          type: integer

    # ── IDE /page-review ────────────────────────────────────────────────
    PageReviewRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Full source code of the file to review
        language:
          type: string
          description: Language hint
        filePath:
          type: string
          description: Virtual file path
        projectContext:
          type: string
          description: Free-text description of the project
        model:
          type: string
          description: Override the LLM model (defaults to AGENT_MODEL_CODE)

    CategorizedSuggestion:
      type: object
      required: [title, detail, priority]
      properties:
        title:
          type: string
        detail:
          type: string
        priority:
          type: string
          enum: [high, medium, low]

    PageReviewCategories:
      type: object
      required: [correctness, maintainability, standards, enhancements]
      properties:
        correctness:
          type: array
          items:
            $ref: "#/components/schemas/CategorizedSuggestion"
          maxItems: 12
        maintainability:
          type: array
          items:
            $ref: "#/components/schemas/CategorizedSuggestion"
          maxItems: 12
        standards:
          type: array
          items:
            $ref: "#/components/schemas/CategorizedSuggestion"
          maxItems: 12
        enhancements:
          type: array
          items:
            $ref: "#/components/schemas/CategorizedSuggestion"
          maxItems: 12

    PageReviewResponse:
      type: object
      required: [requestId, model, language, filePath, categories, latencyMs]
      properties:
        requestId:
          type: string
          format: uuid
        model:
          type: string
        language:
          type: string
        filePath:
          type: string
        categories:
          $ref: "#/components/schemas/PageReviewCategories"
        latencyMs:
          type: integer

    # ── Upload /upload/image-classify ───────────────────────────────────
    UploadImageClassifyRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Image file (any format Ollama vision model supports; max 50 MB)
        prompt:
          type: string
          description: Custom vision prompt (defaults to "Describe this image and identify what it most likely contains.")
        model:
          type: string
          description: Override the vision model (defaults to TOOL_VISION_MODEL / llava-llama3)

    ImageClassifyResponse:
      type: object
      required: [model, response]
      properties:
        model:
          type: string
        path:
          type: string
          description: Only present when the tool was called with a disk path
        response:
          type: string
          description: The model's textual description/classification

    # ── Upload /upload/speech-to-text ───────────────────────────────────
    UploadSpeechToTextRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Audio file (WAV, MP3, etc.; max 50 MB)
        model:
          type: string
          description: Override the STT model (defaults to TOOL_STT_MODEL / whisper)
        language:
          type: string
          description: ISO 639-1 language hint (e.g. "en", "it")
        prompt:
          type: string
          description: Context/prompt to guide transcription

    SpeechToTextResponse:
      type: object
      required: [model, text]
      properties:
        model:
          type: string
        path:
          type: string
          description: Only present when the tool was called with a disk path
        text:
          type: string
          description: Transcribed text content

    # ── Upload /upload/read-pdf ─────────────────────────────────────────
    UploadReadPdfRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PDF file (max 50 MB)

    ReadPdfResponse:
      type: object
      required: [pageCount, text]
      properties:
        path:
          type: string
          description: Only present when the tool was called with a disk path
        pageCount:
          type: integer
          description: Number of pages in the PDF
        text:
          type: string
          description: Extracted text content

    # ── Sketch /ink ─────────────────────────────────────────────────────
    InkRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: Sketch image file (PNG, JPG, WEBP, GIF; max 10 MB)
        model:
          type: string
          description: Override the vision model (defaults to TOOL_VISION_MODEL)

    InkResponse:
      type: object
      required: [requestId, model, originalName, inkingDescription, latencyMs]
      properties:
        requestId:
          type: string
          format: uuid
        model:
          type: string
        originalName:
          type: string
        inkingDescription:
          type: string
        latencyMs:
          type: integer

    # ── Sketch /ink-and-color ───────────────────────────────────────────
    SketchState:
      type: string
      enum: [sketch, inked, unknown]

    InkAndColorRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: Image file (PNG, JPG, WEBP, GIF; max 10 MB)
        model:
          type: string
          description: Override the vision model
        sketchState:
          $ref: "#/components/schemas/SketchState"

    InkAndColorResponse:
      type: object
      required: [requestId, model, originalName, detectedState, colorizationDescription, latencyMs]
      properties:
        requestId:
          type: string
          format: uuid
        model:
          type: string
        originalName:
          type: string
        detectedState:
          $ref: "#/components/schemas/SketchState"
        colorizationDescription:
          type: string
        latencyMs:
          type: integer

    # ── OpenAI Compat /v1/models ────────────────────────────────────────
    OpenAiModelObject:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          description: "Model identifier: manna, manna-agent, manna-fast, manna-reasoning, manna-code"
        object:
          type: string
          enum: [model]
        created:
          type: integer
          description: Unix timestamp
        owned_by:
          type: string
          enum: [manna]

    OpenAiModelListResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/OpenAiModelObject"

    # ── OpenAI Compat /v1/chat/completions ──────────────────────────────
    OpenAiChatMessageContent:
      oneOf:
        - type: string
        - type: array
          items:
            oneOf:
              - type: object
                required: [type, text]
                properties:
                  type:
                    type: string
                    enum: [text]
                  text:
                    type: string
              - type: object
                required: [type, image_url]
                properties:
                  type:
                    type: string
                    enum: [image_url]
                  image_url:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string

    OpenAiChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          $ref: "#/components/schemas/OpenAiChatMessageContent"

    OpenAiChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            Manna model ID: manna, manna-agent, manna-fast, manna-reasoning, manna-code.
            Any other string falls back to auto-routing.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenAiChatMessage"
          minItems: 1
        stream:
          type: boolean
          default: false
          description: When true, returns SSE stream of ChatCompletionChunk objects
        temperature:
          type: number
          description: Accepted but ignored (Manna uses profile-based temperature)
        max_tokens:
          type: integer
          description: Accepted but ignored
        top_p:
          type: number
          description: Accepted but ignored
        frequency_penalty:
          type: number
          description: Accepted but ignored
        presence_penalty:
          type: number
          description: Accepted but ignored
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Accepted but ignored
        n:
          type: integer
          description: Accepted but ignored
        allowWrite:
          type: boolean
          default: false
          description: "Extension: enable write tools. Also triggered by [WRITE] prefix in message."

    OpenAiChatCompletionChoice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
        message:
          type: object
          required: [role, content]
          properties:
            role:
              type: string
              enum: [assistant]
            content:
              type: string
        finish_reason:
          type: string
          enum: [stop, length]

    OpenAiUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          description: Always 0 (Manna does not track tokens)
        completion_tokens:
          type: integer
          description: Always 0
        total_tokens:
          type: integer
          description: Always 0

    OpenAiChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
          description: "Format: chatcmpl-<uuid>"
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          description: Unix timestamp
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/OpenAiChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/OpenAiUsage"